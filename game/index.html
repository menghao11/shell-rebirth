<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="弹壳轮回">
<title>弹壳轮回 · 第一关 废弃前线</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; height:100dvh; background:#0d0d0f; overflow:hidden; position:fixed; inset:0;
    touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior:none; }
  /* #game and #pad boxes are sized by DK.layout() (src/main.js) from the visual viewport minus the safe-area insets;
     the CSS below is the no-JS fallback. Phaser FIT + CENTER_BOTH then fits 960x540 inside #game without cropping. */
  #game { position:fixed; top:env(safe-area-inset-top); right:env(safe-area-inset-right); bottom:env(safe-area-inset-bottom); left:env(safe-area-inset-left); overflow:hidden; }
  #safe { position:fixed; left:0; top:0; width:0; height:0; visibility:hidden; pointer-events:none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  /* portrait touch pad (below the game view) */
  #pad { display:none; position:fixed; touch-action:none; z-index:5; -webkit-user-select:none; user-select:none; }
  body.portrait-pad #pad { display:block; }
  #pad .pbtn { position:absolute; box-sizing:border-box; border-radius:50%; border:3px solid rgba(255,255,255,.65); background:rgba(0,0,0,.4);
    color:#fff; font:bold 17px/1 -apple-system, "PingFang SC", sans-serif; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  #pad .pbtn.on { background:rgba(242,193,78,.55); }
  #pad .pbtn.fire { background:rgba(192,57,43,.45); border-width:4px; border-color:rgba(255,255,255,.8); }
  #pad .pbtn.fire.on { background:rgba(255,90,60,.65); }
  #pad .pbtn.off { opacity:.4; } #pad .pbtn.hide { display:none; }
  #pad .ring { position:absolute; box-sizing:border-box; border-radius:50%; border:3px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06); pointer-events:none; }
  #pad .knob { position:absolute; border-radius:50%; background:rgba(255,255,255,.5); pointer-events:none; }
  #pad .knob.aim { background:rgba(255,106,74,.6); }
  #pad .knob.fireknob { background:rgba(255,255,255,.55); border:2px solid rgba(255,255,255,.8); box-sizing:border-box; }
  #game canvas { touch-action:none; }
  #rotate { display:none; position:fixed; inset:0; z-index:10; background:rgba(10,10,12,.94); color:#f2e6c9;
    font: 18px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; text-align:center;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #rotate .phone { font-size:44px; animation: rot 1.6s ease-in-out infinite; }
  #rotate button { font:inherit; font-size:15px; padding:8px 18px; border-radius:8px; border:1px solid #f2e6c9; background:none; color:#f2e6c9; }
  @keyframes rot { 0%,30%{transform:rotate(0)} 60%,100%{transform:rotate(90deg)} }
  @media (orientation: portrait) and (pointer: coarse) { body:not(.rotate-ok) #rotate { display:flex; } }
</style>
</head>
<body>
<div id="game"></div>
<div id="pad"></div>
<div id="safe"></div>
<div id="rotate"><div class="phone">📱</div><div>请把手机横过来玩<br><small>（竖屏也能玩，但画面会很小）</small></div><button id="rotate-ok">仍然继续</button></div>
<script>
  document.getElementById('rotate-ok').addEventListener('click', function(){ document.body.classList.add('rotate-ok'); });
  // iOS Safari: block pinch-zoom / double-tap zoom / page scroll
  ['gesturestart','gesturechange','gestureend'].forEach(function(e){ document.addEventListener(e, function(ev){ ev.preventDefault(); }, {passive:false}); });
  document.addEventListener('touchmove', function(ev){ ev.preventDefault(); }, {passive:false});
  document.addEventListener('dblclick', function(ev){ ev.preventDefault(); }, {passive:false});
  document.addEventListener('contextmenu', function(ev){ ev.preventDefault(); });
</script>

<script src="src/main.js?v=20261031g"></script>
</body>
</html>
